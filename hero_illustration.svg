<svg viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos compañeros de departamento en un living">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="520" height="520" rx="46"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF6F4"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="520" height="520" fill="url(#sky)"/>

    <!-- floor -->
    <rect x="0" y="392" width="520" height="128" fill="#F4ECE1"/>
    <rect x="0" y="392" width="520" height="8" fill="#E7DBC9"/>

    <!-- window -->
    <rect x="300" y="70" width="170" height="150" rx="12" fill="#fff" stroke="#D7E7E4" stroke-width="6"/>
    <rect x="312" y="82" width="146" height="126" rx="6" fill="#DCF1EE"/>
    <!-- city skyline in window -->
    <g fill="#9FD8D0">
      <rect x="320" y="150" width="22" height="58"/>
      <rect x="348" y="128" width="26" height="80"/>
      <rect x="380" y="160" width="20" height="48"/>
      <rect x="406" y="138" width="26" height="70"/>
      <rect x="436" y="156" width="18" height="52"/>
    </g>
    <circle cx="430" cy="104" r="16" fill="#FFC857"/>
    <line x1="384" y1="82" x2="384" y2="208" stroke="#fff" stroke-width="5"/>
    <line x1="312" y1="145" x2="458" y2="145" stroke="#fff" stroke-width="5"/>

    <!-- wall art -->
    <rect x="70" y="92" width="84" height="64" rx="8" fill="#fff" stroke="#E5DFD4" stroke-width="5"/>
    <path d="M82 140 L104 112 L120 132 L134 116 L142 140 Z" fill="#FF6B6B" opacity=".8"/>
    <circle cx="92" cy="108" r="6" fill="#FFC857"/>

    <!-- plant -->
    <rect x="44" y="320" width="46" height="60" rx="8" fill="#FF8E72"/>
    <path d="M67 320 C40 290 44 250 67 238 C90 250 94 290 67 320 Z" fill="#1FB6A6"/>
    <path d="M67 322 C50 300 36 296 28 304 C40 322 56 330 67 322 Z" fill="#2BC9B8"/>
    <path d="M67 322 C84 300 98 296 106 304 C94 322 78 330 67 322 Z" fill="#159b8d"/>

    <!-- couch -->
    <rect x="150" y="320" width="240" height="74" rx="20" fill="#9B8BD4"/>
    <rect x="150" y="300" width="240" height="44" rx="18" fill="#B0A2E0"/>
    <rect x="142" y="300" width="34" height="94" rx="16" fill="#8877C9"/>
    <rect x="364" y="300" width="34" height="94" rx="16" fill="#8877C9"/>
    <rect x="206" y="306" width="56" height="40" rx="12" fill="#FFC857"/>
    <rect x="282" y="306" width="56" height="40" rx="12" fill="#FF6B6B"/>

    <!-- rug -->
    <ellipse cx="260" cy="470" rx="180" ry="26" fill="#EAF6F4"/>

    <!-- PERSON LEFT (teal) -->
    <g>
      <ellipse cx="195" cy="486" rx="44" ry="10" fill="#000" opacity=".05"/>
      <rect x="172" y="300" width="46" height="92" rx="22" fill="#1FB6A6"/>
      <circle cx="195" cy="276" r="30" fill="#F7C9A8"/>
      <path d="M167 270 a28 28 0 0 1 56 0 v-6 a28 28 0 0 0 -56 0 Z" fill="#2C3E50"/>
      <path d="M167 268 q28 -34 56 0 v-10 q-28 -28 -56 0 Z" fill="#33415a"/>
      <!-- arm reaching -->
      <rect x="210" y="330" width="58" height="18" rx="9" fill="#1FB6A6" transform="rotate(-8 210 330)"/>
      <circle cx="266" cy="326" r="11" fill="#F7C9A8"/>
    </g>

    <!-- heart between -->
    <path d="M260 300 c-10 -16 -34 -6 -24 12 c5 9 24 22 24 22 c0 0 19 -13 24 -22 c10 -18 -14 -28 -24 -12 Z" fill="#FF6B6B"/>

    <!-- PERSON RIGHT (navy) -->
    <g>
      <ellipse cx="325" cy="486" rx="44" ry="10" fill="#000" opacity=".05"/>
      <rect x="302" y="300" width="46" height="92" rx="22" fill="#2C3E50"/>
      <circle cx="325" cy="276" r="30" fill="#E8B58F"/>
      <path d="M298 272 a27 26 0 0 1 54 -2 q-6 -30 -27 -30 q-24 0 -27 32 Z" fill="#3a2b22"/>
      <!-- arm reaching -->
      <rect x="252" y="330" width="58" height="18" rx="9" fill="#2C3E50" transform="rotate(8 310 330)"/>
      <circle cx="254" cy="326" r="11" fill="#E8B58F"/>
    </g>

    <!-- floating compatibility badge -->
    <g transform="translate(372 250)">
      <rect x="-8" y="-22" width="116" height="48" rx="24" fill="#fff" stroke="#EAF0EF" stroke-width="3"/>
      <circle cx="18" cy="2" r="14" fill="#1FB6A6"/>
      <path d="M12 2 l4 5 l8 -10" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="-2" font-family="Hanken Grotesk, Arial" font-size="13" font-weight="800" fill="#2C3E50">94%</text>
      <text x="40" y="14" font-family="Hanken Grotesk, Arial" font-size="9.5" font-weight="600" fill="#7a8794">compatibles</text>
    </g>
  </g>
</svg>
